d\n11:14 Use the other artifact types meanwhile\n11:38 Summary: what we learned\n11:49 Join the Delivery Pilot community\n\nTakeaways:\n1. Keep Claude and your machine up to date.\n2. Don't get stuck on one artifact type; try Docs, Slides, Design and Data too.\n3. If a feature is missing, it may simply not have reached your account yet. Rollouts take time.\n\nHonest notes: this is my own experience on one Pro account and one Mac. Claude's behaviour and rollout change often, so your screen may differ. I'm not affiliated with Anthropic.\n\n\ud83d\ude80 Join our Skool community, Delivery Pilot: https://www.skool.com/delivery-pilot-8938\n\n#Claude #ClaudeAI #Artifacts #Whiteboard #AITools\n\n## Tags (under 500 chars)\n\nclaude, claude ai, claude whiteboard, claude artifacts, claude design, claude desktop app, claude missing feature, claude new features, claude update, anthropic claude, infinite canvas, ai whiteboard, claude mac app, claude not showing, claude beta features, AI tools\n\n## Pinned comment\n\nNew term of the day: Artifact. In Claude, an artifact is a document, slide deck, design or board that Claude builds beside the chat, which you can keep editing and Claude knows its content. A Whiteboard is the same idea on an infinite canvas. New types roll out gradually, so if you can't see one, update the app and check again in a few days.\nStep by step inside our community Delivery Pilot: https://www.skool.com/delivery-pilot-8938\nWhich artifact type do you use most?\n\n## Upload settings\n\n- Audience: Not made for kids\n- Altered or synthetic content: No (own voice, real screen recording)\n- Category: Science & Technology\n- Visibility: Private first, then Public after the check below\n- Thumbnail: 1920x1080 (rendered with `cd remotion && npm run still` -> `assets/thumbnail.jpg`)\n\n## Published Links\n\n- YouTube: https://youtu.be/fnKeTQYBHN8\n- LinkedIn: https://lnkd.in/p/eZreMED5\n- X: https://x.com/rifaterdemsahin/status/2120640398091804833\n\n## Check before
