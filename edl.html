const SRC = "# EDL: edit decision list and how we worked\n\n- Export: 12:23.01 of footage plus a 21 s ending = 12:44.01.\n- **Timecodes:** `m:ss.ss`. *Source* = the original synced video (player: Original). *Export* = after the edits (player: Latest export; the typing speed-up and the ending shift later times). The owner's notes use `[export m:ss]`; `04:17:28` style timecodes are `mm:ss:ff` at 30 fps.\n- Generated by `scripts/build_edl.py` from `remotion/src/overlays.json`, `cuts.json` and `assets/edl_decisions.json`. Edit those, not this file.\n\n## 1. Edit decision list\n\n| # | Type | Source in | Source out | Export in | Export out | Sec | What | Why / request | Status |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | INTRO | 0:00.00 | 0:04.30 | 0:00.00 | 0:04.30 | 4.3 | Title card (Claude Whiteboard MISSING?) | hides the OBS Studio window at the start; extended by 2 s on request | done |\n| 2 | SLIDE | 0:04.30 | 0:16.00 | 0:04.30 | 0:16.00 | 11.7 | \u201cWhat we are doing\u201d: Claude added new artifact types, including a Whiteboard (infinite canvas); It has not shown up on my account:  | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 3 | SLIDE | 4:18.50 | 4:24.40 | 4:11.48 | 4:17.38 | 5.9 | \u201cNext: update\u201d: Quit and reopen Claude, then update the Mac | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 4 | SLIDE | 4:42.50 | 5:12.40 | 4:35.48 | 5:05.38 | 29.9 | \u201cOne AI updating another\u201d: Update the system so new features can arrive; A script or a bot can run the Claude update; I use my own bot to | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 5 | SLIDE | 5:24.50 | 5:48.40 | 5:17.48 | 5:41.38 | 23.9 | \u201cKeeping tools up to date\u201d: Check Claude is installed and current; My chief-of-staff bot, plus my own bots for repeat jobs; Watching my us | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 6 | SLIDE | 5:52.50 | 6:00.40 | 5:45.48 | 5:53.38 | 7.9 | \u201cChecking again\u201d: Artifacts: the Design tab and the Whiteboard are still not there | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 7 | SLIDE | 6:38.50 | 7:06.40 | 6:31.48 | 6:59.38 | 27.9 | \u201cVersion check\u201d: Claude Desktop is up to date; Found an old broken copy and removed it; Updating the computer regularly helps | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 8 | SLIDE | 7:16.50 | 7:30.40 | 7:09.48 | 7:23.38 | 13.9 | \u201cUpgrade the system too\u201d: The upgrade also covers the system; Old copy removed: all good; Why: I want these new actions available | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 9 | SLIDE | 8:36.50 | 8:44.40 | 8:29.48 | 8:37.38 | 7.9 | \u201cWhile it updates\u201d: The update runs in the background; Claude keeps working meanwhile | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 10 | SLIDE | 9:46.50 | 10:02.40 | 9:39.48 | 9:55.38 | 15.9 | \u201cClaude builds the canvas\u201d: Claude names and fills in the sections; Double click any part to edit or comment | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 11 | SLIDE | 11:12.50 | 11:29.00 | 11:05.48 | 11:21.98 | 16.5 | \u201cUpdate finished\u201d: Close and reopen Claude; My bots get updates too: all agents keep updating | covers a personal or distracting window (IBM chat, Grok Bot, family photo widget); narration kept | done |\n| 12 | BLUR | 0:13.50 | 12:30.50 | 0:13.50 | \u2013 | 737.0 | 18 frosted boxes: chat-title list in the app sidebar | private titles and names; boxes generated from OCR (build_blurs.py) | done |\n| 13 | BLUR | 3:43.50 | 12:08.50 | 3:36.48 | 12:01.48 | 505.0 | 7 frosted boxes: mini sidebar inside the pasted screenshot | private titles and names; boxes generated from OCR (build_blurs.py) | done |\n| 14 | IMAGE | 1:51.00 | 2:03.00 | 1:43.98 | 1:55.98 | 12.0 | Picture whiteboard.jpeg: \"This is the feature I expected to see: Whiteboard\" with a box and an arrow | owner image: the Whiteboard tile that should have appeared in Artifacts | done |\n| 15 | SPEED | 1:08.47 | 1:19.00 | 1:08.47 | 1:11.98 | 10.5 | 3x, muted, captions hidden | typing the prompt (01:08:14 onwards) | done |\n| 16 | AUDIO | 9:26.00 | 12:30.03 | 9:18.98 | 12:23.01 | 184.0 | Noise reduction (hoover): stationary profile from 592\u2013622 s, strength 0.8, 1.5 s crossfade in | owner note at export 9:25; the hoover runs from about 571 s to the end; cutting it would remove the conclusion | done |\n| \u2013 | CUT | \u2013 | \u2013 | \u2013 | \u2013 | 0 | none applied | candidates below; nothing is cut until the owner decides | open |\n| 17 | OUTRO | \u2013 | \u2013 | 12:23.01 | 12:34.01 | 11.0 | Summary: what we learned | owner request: end with a summary, then the community call to action | done |\n| 18 | OUTRO | \u2013 | \u2013 | 12:34.01 | 12:44.01 | 10.0 | Learn it in depth (Delivery Pilot on Skool) | owner request: end with a summary, then the community call to action | done |\n\n## 2. How we worked\n\n1. **Prepare locally.** The MacBook syncs the clips to the voice, renders the 1080p base, transcribes with Whisper, OCRs the screen (Apple Vision) and writes a one-page `REPORT.md`. Claude reads that text, not frames (see the Architecture page).\n2. **Owner reviews in the player.** Original vs Latest export (or side by side), with J/K/L speed keys. Notes are timestamped `[orig m:ss]` / `[export m:ss]` and pasted back.\n3. **Interpret, then decide.** Each note is mapped to source time (export time + the time saved by speed-ups), checked against the data (transcript, OCR, audio analysis, one still), and turned into an entry in `overlays.json`, `cuts.json` or an audio step. If the literal request would damage the video (cutting three minutes to remove a hoover), do the smaller fix that meets the goal and say so.\n4. **Cover before cut.** Personal windows are covered with slides so the voice track stays whole; only dead or repeated parts are candidates for cuts, and nothing is cut until the owner decides.\n5. **Re-render once.** All pending edits go into one export (about 29 min), never one render per note.\n6. **Verify by script.** `verify_export.py` OCRs the finished export for leaked text; stills confirm the look; numbers confirm audio. Anything found becomes a new decision (see #6).\n7. **Record it here.** Every request, interpretation, implementation and check is a row in the decision log, so the next video starts from these rules.\n\n## 3. Decision log (requests and how each was handled)\n\n| # | When | Who | Said | Decision | Implemented in | Checked by |\n|---|---|---|---|---|---|---|\n| 1 | round 1 | owner | have initial 0:00 stay 2 seconds more longer Claude Whiteboard missing | Intro card (Thumb design) extended from 2.3 s to 4.3 s on the source timeline | `overlays.json intro_card.to = 4.3` | still at 10 s; player |\n| 2 | round 1 | owner | remove the background where it shows IBM, instead place a slide that explains what we are doing | Slide 'What we are doing' over 4.3 to 16.0 s; the real recording there showed an IBM chat and a personal Grok Bot window | `overlays.json slides[0]` | OCR found the IBM chat title on screen 4 to 16 s; still at 10 s |\n| 3 | round 1 | owner | cover up personal stuff with slides | Found 9 more windows with personal apps (OCR: Skool, LinkedIn, Gmail, Rag Manager lists) and covered each with a short explainer slide written from what is said at that moment. Covered, not cut, so the narration stays intact | `scripts/find_personal_windows.py -> overlays.json slides[1..9]` | verify_export.py OCR of the final video |\n| 4 | round 1 | owner | 01:08:14 typing speed up the back footage | Timecode read as mm:ss:ff at 30 fps = 68.47 s. Typing runs to the send at about 79 s: played at 3x and muted (speech sped up is unusable; the typed text is on screen). Captions hidden inside it | `overlays.json speedups[0]; cuts.ts playbackRate` | export is 10.5 s shorter there; time map in export_map.js |\n| 5 | round 1 | owner | blur the parts that say market participant onboarding 04:17:28 and similar places | 04:17:28 = 257.93 s. Blur the chat-title list in the app sidebar whenever it shows (two fixed boxes), sensitive words anywhere, and the mini sidebar inside the pasted screenshot (anchored to the line under it). Boxes are generated from OCR, not placed by hand | `scripts/ocr_frames.swift, build_blurs.py -> overlays.json blurs` | real still at 4:17:28; verify_export.py |\n| 6 | verification | assistant | verify_export.py found sensitive text still visible at 6:30, 6:58, 8:36 and 12:22 | OCR samples every 2 s, so edges leaked 1 to 2 s. Pad every blur box by 1.5 s and slides by 0.5 s before and 1.8 s after; checker flags app lists only when 2+ lines show together | `build_blurs.py PAD; overlays.json slides; verify_export.py` | re-run verify_export.py on the new export |\n| 7 | round 2 | owner | [export 0:03] in and out transition should not be there | Removed every in/out effect: intro card and slides cut hard (no fades), slide bullets appear at once, caption phrases appear and disappear without spring or fade (the active word is still highlighted by colour). Audio fades at cuts stay (they prevent clicks) | `Slide.tsx, ImageOverlays.tsx, Subtitles.tsx` | stills; ask the owner if a specific effect at 0:03 was meant |\n| 8 | round 2 | owner | [export 9:25] the hoover comes in the audio, cut all that part out | Export 9:25 = source 572 s. Spectrogram and noise-floor analysis: the hoover starts at about 571 s and runs to the end of the recording (haze +12 dB). Cutting all of it would remove the planner canvas demo and the conclusion (about 3 min), so the hoover is removed with noise reduction learned from 592 to 622 s (hoover-only room tone), from 566 s on, with a 1.5 s crossfade. Result: haze back to 0 dB vs the clean part, speech level -0.5 dB | `scripts/denoise_audio.py -> *-1080p-clean.mp4 (video stream copied); remotion/public/base.mp4 points to it` | numbers printed by the script (before/after per minute). Owner to listen; a hard cut remains possible if wanted |\n| 9 | round 2 | owner | [export 11:20] remove the family picture part in the back | Export 11:20 = source 687 s: while the app quits and reopens the desktop shows the wallpaper and a photo widget with people. Covered by the 'Update finished' slide, extended to 672.5 to 689.0 s (narration kept) | `overlays.json slides[9]` | still at source 686 s shows the slide |\n| 10 | round 2 | owner | [export 12:23] end the video with a summary part | Added an ending after the footage: 'Summary: what we learned' slide, 11 s, four points taken from what is said (gradual rollout, no beta switch, update everything, use other artifact types). Silent | `overlays.json outro[0]; Outro.tsx` | still at the first outro frame |\n| 11 | round 2 | owner | at the end have the CTA to delivery pilot skool community to learn in depth | Final 10 s card: 'Learn it in depth', 'Join the Delivery Pilot community on Skool', skool.com/delivery-pilot-8938, 'Link in the description and the pinned comment'. No income or result promises | `overlays.json outro[1]` | still at the CTA frame |\n| 12 | player | owner | player needs speed up and speed down, J K L mapped; space bar to stop | Space/K pause, L faster (1,2,4,8x), J slower (down to 0.25x), 1 normal, arrows 5 s, comma/period frame step, F fullscreen; ignored while typing | `player.html` | simulated key presses in Chrome |\n| 13 | player | owner | have original and the latest export on the player page | Original / Latest export buttons, side by side with a time map, export info, version-tagged feedback notes | `player.html, export_map.js` | opened in Chrome |\n| 14 | round 1 | owner | have the subtitles done / animated | Whisper word timings -> animated captions (active word highlighted) and .srt/.vtt for YouTube; product names fixed (Claude, Grok bot, Homebrew) | `build_subs.py, Subtitles.tsx` | stills; owner proof-read pending |\n| 15 | round 3 | owner | use whiteboard.jpeg from Downloads: mention in the video this was the expected feature to see, and use an arrow to the whiteboard feature | Image card at 1:51 to 2:03 (source 111 to 123 s), where the narration says the whiteboard is missing: caption 'This is the feature I expected to see: Whiteboard', orange box around the Whiteboard (Beta) tile and an arrow pointing at it. Image stays local (remotion/public/img, not committed) | `overlays.json images[0]; ImageOverlays.tsx ImageCard` | real still at source 116 s |\n| 16 | round 3 | owner | logically group to menu | Site menu grouped: Start, Make, Review, Links | `nav.js GROUPS` | opened in Chrome |\n| 17 | round 3 | owner | master spec should create a video faster by getting what is needed; include a prompt to execute on top | Prompt to execute and a 'get what is needed' checklist added at the top of the spec | `MASTER_SPEC.md top` | kit test from scratch |\n\n## 4. Cut candidates (nothing applied yet)\n\n- run `scripts/find_repeats.py`\n\n## 5. Rules learned for the next EDL\n\n- Convert every owner timecode to source time first: `source = export + time saved by earlier speed-ups`.\n- Measure, do not guess: spectrogram and noise floor for audio problems, OCR for text, one still for a look.\n- Prefer a fix that keeps content (cover, blur, denoise, speed up) over a cut; state clearly when the request was met another way.\n- Pad every generated box or slide at its edges: sampling every 2 s can miss a second.\n- Keep hard cuts (no fades) unless the owner asks for transitions.\n";
const raw = document.getElementById("raw"), md = document.getElementById("md");
if (window.marked) {
  md.innerHTML = marked.parse(SRC);
  if (false) document.querySelectorAll("h2").forEach(h => {
    const b = document.createElement("button"); b.className = "copy"; b.textContent = "Copy section";
    b.onclick = () => { let t = h.textContent + "\n", n = h.nextElementSibling; while (n && n.tagName !== "H2") { t += n.innerText + "\n"; n = n.nextElementSibling; } copyText(t.trim()); b.textContent = "Copied"; };
    h.appendChild(b);
  });
} else { raw.hidden = false; raw.textContent = SRC; }
