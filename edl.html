t clothe, fix the subtitles, check other places as well; [export 11:38] not clothe but Claude | Caption fix \"clothe/clothes\" to \"Claude\" added to project.json. Searched the transcript for every look-alike (cloth, clod, claw, clou, clau): 5 slips in total (4 clothe, 1 clothes), all fixed; earlier fixes (cloud, growth bot, Kamba, hdml, homebrief) unchanged; .srt/.vtt regenerated | v4 | `project.json caption_fixes; build_subs.py` | no \"clothe\" left in subtitles.srt; searched by regex |\n| 26 | round 4 | owner | [export 9:29] there is a hover sound it needs to be cutted start; [export 10:20] cut till this timeline hover ends and the design is out. Show a hover gif and apologize | Cut source 574.4 to 625.2 s (50.8 s). The note said export 10:20 (= source 627.0) but the next sentence starts at 625.4, so the cut ends just before it instead of chopping \"Yes, now it's created\u2026\"; it starts in the silence before \"And let's see the double click\u2026\". A 6 s card is placed at the cut: \"Sorry! A hoover joined the recording here, so about 50 seconds are cut.\" with an animated cartoon hoover (frame-driven, like a GIF). Everything after moves 45 s earlier | v4 | `cuts.json; overlays.json inserts[0]; InsertCard.tsx; cuts.ts` | stills of the card and the frame after the cut; time map checked (card at export 9:27) |\n| 27 | round 4 | owner | [export 12:01] add the visual expected output that is in downloads folder | Owner chose to show whiteboard.jpeg again (the only new file in Downloads; the WhatsApp copy is byte-identical). Picture card at source 726 to 734 s (export 12:01 in v3), caption \"The expected output: Whiteboard\", orange box and arrow on the Whiteboard tile | v4 | `overlays.json images[1]` | card geometry reused from the 1:44 card (checked by still) |\n| 28 | round 4 | owner | name every export with a version number and mention that in the feedback | Every export is numbered and never overwritten: exports/<slug>-v<N>.mp4 with a registry (assets/exports.j here.\n- 12:03  repeats 'to be able to' (first at 11:42): Be ready to be able to use the other features on here and other\n- 12:12  repeats 'artifacts that you are' (first at 12:08): This is not that different than the other artifacts that you are going\n- 4:51  'update, update': I\n\n## 5. Rules learned for the next EDL\n\n- Convert every owner timecode to source time first: `source = export + time saved by earlier speed-ups`.\n- Measure, do not guess: spectrogram and noise floor for audio problems, OCR for text, one still for a look.\n- Prefer a fix that keeps content (cover, blur, denoise, speed up) over a cut; state clearly when the request was met another way.\n- Pad every generated box or slide at its edges: sampling every 2 s can miss a second.\n- Keep hard cuts (no fades) unless the owner asks for transitions.\n";
